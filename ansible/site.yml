---
- name: Self-hosted Gitea — full host build
  hosts: gitea
  become: true

  pre_tasks:
    - name: Verify .env exists on the control machine
      ansible.builtin.stat:
        path: "{{ repo_root }}/.env"
      register: env_file
      delegate_to: localhost
      become: false
      run_once: true

    - name: Fail early when .env is missing
      ansible.builtin.fail:
        msg: >-
          {{ repo_root }}/.env not found. Copy .env.example to .env and fill it in
          before running this playbook — the gitea_stack role copies it to the server.
      when: not env_file.stat.exists
      run_once: true

    - name: Load .env into Ansible facts
      ansible.builtin.set_fact:
        gitea_env: >-
          {{ dict(lookup('ansible.builtin.file', repo_root ~ '/.env').splitlines()
             | reject('match', '^\s*(#|$)')
             | map('split', '=', 1) | list) }}
      delegate_to: localhost
      become: false
      run_once: true

  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening, security]
    - role: docker
      tags: [docker]
    - role: nginx_tls
      tags: [nginx, tls]
    - role: gitea_stack
      tags: [gitea, deploy]
    - role: backups
      tags: [backups]
