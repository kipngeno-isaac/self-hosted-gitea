---
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0750"

- name: Copy stack files
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item }}"
    dest: "{{ deploy_dir }}/"
    mode: preserve
  loop:
    - docker-compose.yml
    - monitoring
    - nginx
    - scripts
    - Makefile

- name: Copy .env
  ansible.builtin.copy:
    src: "{{ repo_root }}/.env"
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Bring the stack up
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}"
    state: present
    pull: always
    remove_orphans: true

- name: Wait for Gitea to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/healthz"
    status_code: [200]
  register: gitea_health
  retries: 30
  delay: 5
  until: gitea_health.status == 200
