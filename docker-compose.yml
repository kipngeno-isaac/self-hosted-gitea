version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: gitea-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - gitea-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gitea-redis
    restart: always
    command: redis-server --save "" --appendonly no
    networks:
      - gitea-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
      - "0.0.0.0:222:22"
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${POSTGRES_DB}
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__server__DOMAIN=${DOMAIN}
      - GITEA__server__ROOT_URL=https://${DOMAIN}/
      - GITEA__server__SSH_DOMAIN=${DOMAIN}
      - GITEA__server__SSH_PORT=222
      - GITEA__server__OFFLINE_MODE=true
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__security__REVERSE_PROXY_LIMIT=1
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=*
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__log__LEVEL=info
      - GITEA__metrics__ENABLED=true
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=network=tcp,addr=redis:6379,db=0,pool_size=100,idle_timeout=180
      - GITEA__session__PROVIDER=redis
      - GITEA__session__PROVIDER_CONFIG=network=tcp,addr=redis:6379,db=1,pool_size=100,idle_timeout=180
      - GITEA__queue__TYPE=redis
      - GITEA__queue__CONN_STR=redis://redis:6379/2
    volumes:
      - ./gitea-data:/data
    networks:
      - gitea-net

  runner-1:
    image: gitea/act_runner:latest
    container_name: gitea-runner-1
    restart: always
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner1-data:/data
    networks:
      - gitea-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  runner-2:
    image: gitea/act_runner:latest
    container_name: gitea-runner-2
    restart: always
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=runner-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner2-data:/data
    networks:
      - gitea-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  runner-3:
    image: gitea/act_runner:latest
    container_name: gitea-runner-3
    restart: always
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=runner-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner3-data:/data
    networks:
      - gitea-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  node-exporter:
    image: prom/node-exporter:latest
    container_name: gitea-node-exporter
    restart: always
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - gitea-net

  prometheus:
    image: prom/prometheus:latest
    container_name: gitea-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - gitea-net

  grafana:
    image: grafana/grafana:latest
    container_name: gitea-grafana
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gitea-net

networks:
  gitea-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
