name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        run: |
          pip install yamllint
          yamllint -d relaxed docker-compose.yml monitoring/prometheus.yml

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Scan docker-compose images with Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy config --exit-code 0 --severity HIGH,CRITICAL docker-compose.yml

      - name: Check for secrets in repo
        run: |
          curl -sfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog filesystem . --only-verified --fail

  deploy-dry-run:
    name: Deploy Dry Run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i 's/^DOMAIN=.*/DOMAIN=test.example.com/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpassword123/' .env
          sed -i 's/^RUNNER_TOKEN=.*/RUNNER_TOKEN=placeholder/' .env
          sed -i 's/^METRICS_TOKEN=.*/METRICS_TOKEN=testtoken/' .env

      - name: Validate compose resolves all variables
        run: docker compose config --quiet

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, security-scan, deploy-dry-run]
    if: always()
    steps:
      - name: Report pipeline status
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.security-scan.result }}" = "success" ] && \
             [ "${{ needs.deploy-dry-run.result }}" = "success" ]; then
            echo "All checks passed"
          else
            echo "One or more checks failed"
            exit 1
          fi
