name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed docker-compose.yml monitoring/prometheus.yml

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck -q
          shellcheck scripts/*.sh

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

  iac:
    name: IaC Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Install Ansible tooling
        run: pip install --quiet ansible-core ansible-lint yamllint

      - name: Lint Ansible YAML
        run: yamllint -d relaxed ansible/

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check playbook syntax
        working-directory: ansible
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini
          ansible-playbook site.yml --syntax-check

      - name: Lint Ansible roles
        working-directory: ansible
        run: ansible-lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: Scan Docker images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          severity: HIGH,CRITICAL
          exit-code: 0

  dry-run:
    name: Deploy Dry Run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i 's/^DOMAIN=.*/DOMAIN=test.example.com/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpassword123/' .env
          sed -i 's/^RUNNER_TOKEN=.*/RUNNER_TOKEN=placeholder/' .env
          sed -i 's/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=testpassword/' .env

      - name: Validate all variables resolve
        run: docker compose config --quiet

  summary:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, iac, security, dry-run]
    steps:
      - run: echo "All checks passed"
