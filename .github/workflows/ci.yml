name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        run: |
          pip install --quiet yamllint
          yamllint -d relaxed docker-compose.yml monitoring/prometheus.yml

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck -q
          shellcheck scripts/*.sh

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: Scan Docker images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          severity: HIGH,CRITICAL
          exit-code: 0

  dry-run:
    name: Deploy Dry Run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i 's/^DOMAIN=.*/DOMAIN=test.example.com/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpassword123/' .env
          sed -i 's/^RUNNER_TOKEN=.*/RUNNER_TOKEN=placeholder/' .env
          sed -i 's/^METRICS_TOKEN=.*/METRICS_TOKEN=testtoken/' .env
          sed -i 's/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=testpassword/' .env

      - name: Validate all variables resolve
        run: docker compose config --quiet

  summary:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, dry-run]
    steps:
      - run: echo "All checks passed"
